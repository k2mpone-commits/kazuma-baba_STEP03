<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <header>
        <h1>TNG CAFE</h1>
        <p>心安らぐ一杯をあなたへ</p>
        <nav>
            <ul>
                <li><a href="#abut">About Us</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
            <img src="" alt="カフェの写真">
        </section>
        <section id="menu">
            <h2>Menu</h2>
            <div class="menu-list">
                <div class="menu-item">
                    <img src="" alt="コーヒー">
                    <p>ブレンドコーヒー</p>
                </div>
                <div class="menu-item">
                    <img src="" alt="ケーキ">
                    <p>ベイクドチーズ</p>
                </div>
                <div class="menu-item">
                    <img src="" alt="ラテ">
                    <p>カフェラテ</p>
                </div>
            </div>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <form action="#">
                <div class="form-group">
                    <label for="name">名前:</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="form-group">
                    <label for="email">メールアドレス:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="message">お問い合わせ内容:</label>
                    <textarea name="message" id="message"></textarea>
                </div>
                <button type="submit">送信</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 20⚪︎⚪︎ TNG Cafe</p>
    </footer>
</body>
</html>
